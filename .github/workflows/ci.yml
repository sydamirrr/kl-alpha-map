name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify project data integrity
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const dir = 'data/projects';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            if (files.length === 0) { console.error('No project JSON files found'); process.exit(1); }
            let ok = 0;
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              const required = ['slug','name','category','area','status','summary','sources','edition_reviewed'];
              const missing = required.filter(k => !p[k]);
              if (missing.length) { console.error(f + ' missing: ' + missing.join(', ')); process.exit(1); }
              if (!p.sources.length) { console.error(f + ' has no sources'); process.exit(1); }
              if (p.slug + '.json' !== f) { console.error(f + ' slug/filename mismatch: ' + p.slug); process.exit(1); }
              ok++;
            }
            console.log('Validated ' + ok + ' project files');
          "
